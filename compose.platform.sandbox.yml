# Optional overlay for code grading; ordinary API/worker services never mount Docker.
services:
  worker:
    environment:
      LLM_TEST_SANDBOX_URL: http://sandbox-worker:8765
      LLM_TEST_SANDBOX_TOKEN: ${LLM_TEST_SANDBOX_TOKEN:?Configure the sandbox token}
    networks: [default, code-private]
    depends_on:
      sandbox-worker:
        condition: service_healthy

  sandbox-worker:
    build:
      context: .
      dockerfile: Dockerfile.sandbox-worker
    image: llm-test-sandbox-worker:latest
    environment:
      LLM_TEST_SANDBOX_TOKEN: ${LLM_TEST_SANDBOX_TOKEN:?Configure the sandbox token}
      LLM_TEST_SANDBOX_IMAGE: ${LLM_TEST_SANDBOX_IMAGE:-python:3.12-slim}
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - /usr/bin/docker:/usr/bin/docker:ro
    user: 65534:65534
    group_add:
    - ${DOCKER_GID:?Configure the host Docker socket group}
    read_only: true
    tmpfs:
    - /tmp:rw,nosuid,nodev,noexec,size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 256m
    networks: [code-private]
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8765/health',headers={'Authorization':'Bearer '+os.environ['LLM_TEST_SANDBOX_TOKEN']}); urllib.request.urlopen(r,timeout=12)
      interval: 30s
      timeout: 15s
      retries: 3
    restart: unless-stopped

networks:
  code-private:
    internal: true
