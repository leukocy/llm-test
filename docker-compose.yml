services:
  llm-benchmark:
    build:
      context: .
      dockerfile: Dockerfile.platform
    image: llm-benchmark:latest
    container_name: llm-benchmark

    # ── Command（Streamlit 已退役, 平台 API 托管前端产物）──
    command: [uvicorn, server.main:app, --host, 0.0.0.0, --port, '8000']

    # ── Ports ──
    ports:
    - ${BIND_HOST:-127.0.0.1}:${PORT:-8000}:8000

    # ── Environment ──
    environment:
    - TZ=Asia/Shanghai
    - HF_ENDPOINT=${HF_ENDPOINT:-https://hf-mirror.com}
    - MODELSCOPE_CACHE=/app/cache/modelscope
    - LLM_TEST_SANDBOX_URL=http://sandbox-worker:8765
    - LLM_TEST_SANDBOX_TOKEN=${LLM_TEST_SANDBOX_TOKEN:-}
    - LLM_TEST_TRUSTED_API_HOSTS=${LLM_TEST_TRUSTED_API_HOSTS:-}
    - LLM_TEST_ALLOW_PRIVATE_ENDPOINTS=${LLM_TEST_ALLOW_PRIVATE_ENDPOINTS:-0}
    env_file:
    - path: .env
      required: false

    # ── Resource Limits ──
    deploy:
      resources:
        limits:
          memory: 16G

    # ── Volumes ──
    volumes:
      # 持久化数据
    - ./data:/app/data
    - ./cache:/app/cache
    - ./api_logs:/app/api_logs
    - ./presets:/app/presets
    - ./results:/app/results
    - ./datasets:/app/datasets
    - /DATA/Model:/DATA/Model:ro
      # Streamlit 配置
    - ./.streamlit:/app/.streamlit:ro

    # ── Health Check ──
    healthcheck:
      test: [CMD, python, -c, import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    # ── Logging ──
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: '3'

    # ── Restart Policy ──
    restart: unless-stopped

    # ── Labels ──
    labels:
      com.llm-test.description: LLM Benchmark Platform
      com.llm-test.version: 2.0.0
    networks:
    - default
    - sandbox-private

  sandbox-worker:
    profiles: [code-eval]
    build:
      context: .
      dockerfile: Dockerfile.sandbox-worker
    image: llm-benchmark-sandbox-worker:latest
    environment:
    - LLM_TEST_SANDBOX_TOKEN=${LLM_TEST_SANDBOX_TOKEN:-}
    - LLM_TEST_SANDBOX_IMAGE=${LLM_TEST_SANDBOX_IMAGE:-python:3.12-slim}
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - /usr/bin/docker:/usr/bin/docker:ro
    user: 65534:65534
    group_add:
    - ${DOCKER_GID:-999}
    read_only: true
    tmpfs:
    - /tmp:rw,nosuid,nodev,noexec,size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 256m
    networks: [sandbox-private]
    restart: unless-stopped

networks:
  sandbox-private:
    internal: true
