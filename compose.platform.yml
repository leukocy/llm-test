services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.platform
    image: llm-test-platform:latest
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: [uvicorn, server.main:app, --host, 0.0.0.0, --port, '8000', --workers, '1']
    ports:
    - ${LLM_TEST_BIND_HOST:-127.0.0.1}:${LLM_TEST_PORT:-8000}:8000
    env_file:
    - path: .env.platform
      required: false
    environment: &platform-env
      LLM_TEST_ENDPOINTS_FILE: /app/config/endpoints.platform.json
      LLM_TEST_DB_PATH: /app/data/benchmark.db
      LLM_TEST_ARTIFACT_ROOT: /app/results/jobs
      HF_HOME: /app/cache/huggingface
      MODELSCOPE_CACHE: /app/cache/modelscope
      XDG_CACHE_HOME: /app/cache
      TIKTOKEN_CACHE_DIR: /app/cache/tiktoken
      LLM_TEST_TOKENIZER_DOWNLOAD_ROOT: /app/cache/tokenizers
      LLM_TEST_HISTORY_ROOT: /app/results/history
    volumes: &platform-volumes
    - platform-data:/app/data
    - platform-results:/app/results
    - platform-cache:/app/cache
    - platform-logs:/app/api_logs
    - platform-datasets:/app/datasets
    - platform-progress:/app/test_progress
    - ${LLM_TEST_TOKENIZERS_DIR:-./tokenizers}:/app/tokenizers:ro
    - ./config/endpoints.platform.json:/app/config/endpoints.platform.json:ro
    read_only: true
    tmpfs:
    - /tmp:rw,nosuid,nodev,size=128m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 512
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=5)"]
      interval: 30s
      timeout: 7s
      retries: 3
    restart: unless-stopped

  worker:
    image: llm-test-platform:latest
    build:
      context: .
      dockerfile: Dockerfile.platform
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: [python, -m, server.worker]
    env_file:
    - path: .env.platform
      required: false
    environment: *platform-env
    volumes: *platform-volumes
    read_only: true
    tmpfs:
    - /tmp:rw,nosuid,nodev,size=128m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 512
    restart: unless-stopped

  migrate:
    image: llm-test-platform:latest
    build:
      context: .
      dockerfile: Dockerfile.platform
    command: [python, -c, "from core.database import db; print(f'Schema ready: {db.path}')"]
    environment: *platform-env
    volumes:
    - platform-data:/app/data
    read_only: true
    tmpfs:
    - /tmp:rw,nosuid,nodev,size=128m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: no

volumes:
  platform-data:
  platform-results:
  platform-cache:
  platform-logs:
  platform-datasets:
  platform-progress:
