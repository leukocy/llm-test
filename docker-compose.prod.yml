# 离线/生产部署专用 compose 文件
# 最小依赖：只需本文件 + 已加载的 llm-benchmark:latest 镜像。
# data/cache/api_logs/presets/results/datasets 若不存在，Docker 会自动创建空目录。
# Streamlit 已退役: 平台 API 在 8000 端口直接托管前端产物。
#
# 用法（镜像已通过 docker load 加载后）：
#   docker compose -f docker-compose.prod.yml up -d

services:
  llm-benchmark:
    image: llm-benchmark:latest
    container_name: llm-benchmark

    command: [uvicorn, server.main:app, --host, 0.0.0.0, --port, '8000']

    ports:
    - ${BIND_HOST:-127.0.0.1}:${PORT:-8000}:8000

    environment:
    - TZ=Asia/Shanghai
    - HF_ENDPOINT=${HF_ENDPOINT:-https://hf-mirror.com}
    - MODELSCOPE_CACHE=/app/cache/modelscope
    - LLM_TEST_SANDBOX_URL=http://sandbox-worker:8765
    - LLM_TEST_SANDBOX_TOKEN=${LLM_TEST_SANDBOX_TOKEN:-}
    - LLM_TEST_TRUSTED_API_HOSTS=${LLM_TEST_TRUSTED_API_HOSTS:-}
    - LLM_TEST_ALLOW_PRIVATE_ENDPOINTS=${LLM_TEST_ALLOW_PRIVATE_ENDPOINTS:-0}

    deploy:
      resources:
        limits:
          memory: 16G

    volumes:
      # 运行时持久化（自动创建，无需预置文件）
    - ./data:/app/data
    - ./cache:/app/cache
    - ./api_logs:/app/api_logs
    - ./presets:/app/presets
    - ./results:/app/results
    - ./datasets:/app/datasets

    healthcheck:
      test: [CMD, python, -c, import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: '3'

    restart: unless-stopped
    networks:
    - default
    - sandbox-private

  sandbox-worker:
    profiles: [code-eval]
    image: llm-benchmark-sandbox-worker:latest
    environment:
    - LLM_TEST_SANDBOX_TOKEN=${LLM_TEST_SANDBOX_TOKEN:-}
    - LLM_TEST_SANDBOX_IMAGE=${LLM_TEST_SANDBOX_IMAGE:-python:3.12-slim}
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - /usr/bin/docker:/usr/bin/docker:ro
    user: 65534:65534
    group_add:
    - ${DOCKER_GID:-999}
    read_only: true
    tmpfs:
    - /tmp:rw,nosuid,nodev,noexec,size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 256m
    networks: [sandbox-private]
    restart: unless-stopped

networks:
  sandbox-private:
    internal: true
